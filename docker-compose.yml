version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: glaux-postgres
    environment:
      POSTGRES_USER: glaux
      POSTGRES_PASSWORD: glaux_secret_password
      POSTGRES_DB: glaux_shortlist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glaux -d glaux_shortlist"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glaux-backend
    environment:
      DATABASE_URL: postgresql://glaux:glaux_secret_password@postgres:5432/glaux_shortlist
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glaux-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
